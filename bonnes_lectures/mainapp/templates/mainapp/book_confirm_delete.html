{% extends 'mainapp/base.html' %}

{% block title %}Supprimer un livre{% endblock %}

{% block content %}

<h1>Supprimer un livre</h1>

<p>Voulez-vous vraiment supprimer "{{ book.title }}" ?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmer la suppression</button>
</form>

<a href="{% url 'book' book.id %}">Annuler</a>

{% endblock %}
